[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-lint"
version = "0.2.0"
description = "Static analysis for Odoo ORM performance anti-pattern"
requires-python = ">=3.10"

[project.scripts]
perf-lint = "perf_lint.cli:main"

# explicit list: the repo root also holds Odoo addon directories, which must
# not be picked up by setuptools auto-discovery
[tool.setuptools]
packages = ["perf_lint", "perf_lint.checks"]

# type checking (dev only, not a runtime dependency): mypy perf_lint tests
[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
